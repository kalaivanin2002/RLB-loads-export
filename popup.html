<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RLB Load Search</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="app-head">
      <h1 class="title">RLB</h1>
    </div>

    <p class="field-hint" style="margin: 0 0 4px;">
      Planning rules and auto-refresh are configured in
      <strong>FleetYes → Settings → RLB Settings</strong> and synced here
      automatically for your carrier.
    </p>

    <label class="field">
      <span>Search location</span>
      <input id="searchLocation" type="text" placeholder="e.g. Darlington, UK" />
      <small class="field-hint">Enter the city or town you want to search for loads near. This is required before you can run a search.</small>
    </label>
    <button id="saveDev" class="btn-secondary" type="button">Save</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RLB Load Search</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="app-head">
      <h1 class="title">RLB</h1>
    </div>

    <!-- Planning rules and scoring now live in FleetYes → Settings → RLB Settings.
         They are synced to this extension automatically for your carrier. Only
         the connection setup below is edited here. -->
    <p class="field-hint" style="margin: 0 0 4px;">
      Planning rules, auto-refresh and scoring weights are configured in
      <strong>FleetYes → Settings → RLB Settings</strong> and synced here
      automatically for your carrier.
    </p>

    <!-- Developer setup: connection only. URLs, token, carrier. Set once. -->
    <button id="toggleDev" class="disclosure" type="button">Developer settings ▾</button>
    <div id="devSettings" class="settings hidden">
      <div class="settings-title">Search</div>
      <label class="field">
        <span>Search location</span>
        <input id="searchLocation" type="text" placeholder="e.g. Darlington, UK" />
        <small class="field-hint">The city all drivers' loads are searched from. Entered here only — it is not synced from FleetYes. Required, or searches won't run.</small>
      </label>
      <div class="settings-title">Developer · connection</div>
      <label class="field">
        <span>Locations API URL (FleetYes/OnTrack)</span>
        <input id="ontrackUrl" type="text" placeholder="https://ontrack-api.agilecyber.com/api/v1/rlb-locations" />
        <small class="field-hint">FleetYes/OnTrack base — also used to derive the approved-places and RLB settings endpoints.</small>
      </label>
      <label class="field">
        <span>Bearer token</span>
        <input id="token" type="password" placeholder="flb_live_…" />
        <small class="field-hint">FleetYes API key. Stored only in this browser — never committed to code.</small>
      </label>
      <button id="saveDev" class="btn-secondary" type="button">Save settings</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RLB Load Search</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h1 class="title">RLB</h1>

    <!-- ── RLB Location Sync ─────────────────────────────────────────────── -->
    <section class="card">
      <div class="card-head">
        <span class="card-title">Location Sync</span>
        <button id="toggleSettings" class="link-btn" type="button">Settings</button>
      </div>

      <div id="settings" class="settings hidden">
        <label class="field">
          <span>Locations API URL (GET/POST)</span>
          <input id="ontrackUrl" type="text" placeholder="https://ontrack-api.agilecyber.com/api/v1/rlb-locations" />
        </label>
        <label class="field">
          <span>Loads ingest URL (POST, optional)</span>
          <input id="ingestUrl" type="text" placeholder="optional — leave empty to download only" />
        </label>
        <label class="field">
          <span>Bearer token</span>
          <input id="token" type="password" placeholder="flb_live_…" />
        </label>
        <label class="field">
          <span>Relay base URL</span>
          <input id="relayBase" type="text" placeholder="https://relay.amazon.co.uk" />
        </label>
        <div class="field-row">
          <label class="field">
            <span>Prefix</span>
            <input id="prefix" type="text" />
          </label>
          <label class="field">
            <span>Letters</span>
            <input id="letters" type="text" />
          </label>
          <label class="field">
            <span>Delay (ms)</span>
            <input id="delayMs" type="number" min="0" step="50" />
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span>Search radius (mi)</span>
            <input id="searchRadius" type="number" min="0" step="1" />
          </label>
          <label class="field">
            <span>Result size</span>
            <input id="resultSize" type="number" min="1" step="10" />
          </label>
        </div>
        <label class="field">
          <span>Max locations to process (0 = all)</span>
          <input id="maxLocations" type="number" min="0" step="1" />
        </label>
        <button id="saveSettings" class="btn-secondary" type="button">Save settings</button>
      </div>

      <button id="syncBtn" class="btn-primary" type="button">Sync RLB Locations (a–z)</button>
      <div id="syncLog" class="log" aria-live="polite"></div>
    </section>

    <!-- ── Find Loads (Phase 2) ──────────────────────────────────────────── -->
    <section class="card">
      <div class="card-head"><span class="card-title">Find Loads</span></div>
      <div id="loadsProgress" class="hint">Idle.</div>
      <button id="findLoadsBtn" class="btn-primary" type="button">Find Loads (all locations)</button>
      <div class="field-row">
        <button id="stopLoadsBtn" class="btn-secondary" type="button" disabled>Stop</button>
        <button id="resumeLoadsBtn" class="btn-secondary" type="button" disabled>Resume</button>
        <button id="retryFailedBtn" class="btn-secondary" type="button" disabled>Retry failed</button>
      </div>
      <button id="downloadLoadsBtn" class="btn-secondary" type="button" disabled>Download results (JSON)</button>
      <div id="loadsLog" class="log" aria-live="polite"></div>
    </section>

    <!-- ── Sync In-Transit Trips ─────────────────────────────────────────── -->
    <section class="card">
      <div class="card-head"><span class="card-title">In-Transit Trips</span></div>
      <div id="tripsProgress" class="hint">Idle.</div>
      <button id="syncTripsBtn" class="btn-primary" type="button">Sync In-Transit Trips</button>
      <button id="downloadTripsBtn" class="btn-secondary" type="button" disabled>Download trips (JSON)</button>
      <div id="tripsLog" class="log" aria-live="polite"></div>
    </section>

  </div>

  <script src="popup.js"></script>
</body>
</html>
